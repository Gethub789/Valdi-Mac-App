name: Build & Package Valdi DMG

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Valdi macOS Application & DMG
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: swift test

      - name: Build & Package DMG
        run: |
          chmod +x Scripts/build_dmg.sh
          ./Scripts/build_dmg.sh

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: Valdi-1.0.0-macOS-Installers
          path: |
            Valdi-*.dmg
            Valdi-*.zip
          if-no-files-found: error
